# DMD-NFT (trainer key dmdnft_rl), mixed reward, u-space KL 1e-4.
#
# Same policy loss as meanflownft_mix.yaml; the difference is x_anchor_2, which
# comes from a separately trained v-predictor (aux_v_model) as
# x_t - t * v_aux(x_t, t) instead of the flow map's central difference. Each
# epoch: one rollout pack -> aux_v flow-matching steps on that pack -> one
# policy step. The aux loop must run first because the policy loss reads
# aux_v_model. Five transformers are resident, so FSDP full_shard is required.
distributed:
  fsdp_sharding: full_shard
  strategy: fsdp
eval:
  dataset: drawbench
  dataset_path: dataset
  enabled: true
  eval_batch_size: 16
  eval_guidance_scale: 1.0
  eval_interval: 50
  eval_num_steps: 4
  eval_prompt_source: dataset
  eval_seed: 12345
  num_media_images: 64
  reward_ckpt_path: ./models/reward_ckpts
  reward_dataset_map:
    aesthetic: drawbench
    clipscore: drawbench
    hpsv2: drawbench
    ocr: ocr
    pickscore: drawbench
  reward_fn:
    aesthetic: 1.0
    clipscore: 1.0
    hpsv2: 1.0
    ocr: 1.0
    pickscore: 1.0
fewstep_rl:
  adv_clip_max: 5.0
  beta: 0.1
  # Central-difference keys are only read when use_ref_v_model is true.
  cd_velocity_source: noise_minus_x0
  central_diff_epsilon: 5.0
  consistency_ratio: 0.25
  decay_type: 1
  diffusion_ratio: 0.5
  kl_weight: 0.0001
  log_sample_images: 8
  num_batches_per_epoch: 16
  num_epochs: 10000
  num_image_per_prompt: 24
  num_inner_epochs: 1
  num_training_timesteps_per_sample: 4
  per_prompt_global_std: true
  per_prompt_stat_tracking: true
  reward_ckpt_path: ./models/reward_ckpts
  reward_fn:
    clipscore: 1.0
    hpsv2: 1.0
    pickscore: 1.0
  rl_decay_interval: 1
  rl_inner_batch_size: 0
  rl_max_timestep: 1000
  rl_min_timestep: 0
  rl_sample_use_ema: false
  # Also gates the aux loop.
  rl_start_epoch: 0
  # Deterministic flow-map rollout, as used for the released checkpoint.
  rollout_type: ode
  sampling_guidance_scale: 1.0
  sampling_num_steps: 4
  share_cd_with_old: true
  text_max_sequence_length: 128
  # false: KL against ref_u_model, a frozen copy of the merged Stage-2 generator.
  use_ref_v_model: false

  # --- aux v-predictor loop (all counts per GPU) ---
  aux_v_enabled: true
  # 0 = renoise_per_epoch * aux_v_batch_size. Values up to
  # num_batches_per_epoch * train.batch_size are drawn from the policy's rollout
  # pack; anything above triggers extra reward-free rollouts.
  max_aux_sample: 0
  aux_v_batch_size: 8
  renoise_per_epoch: 10
  aux_v_gradient_accum: 1

flowmap_model:
  deltatime_type: r
  enabled: true
  gate_value: 0.25
logging:
  enabled: true
  project: fewsteprl
  entity: ''
  run_name: dmdnft_mix
  tags:
  - sd35m
  - dmdnft
  - variant-c
  - aux-v
  - kl-u
  - mixed
  - klw1e-4
  - align-old-stage3
  - '512'
model:
  dtype: bf16
  generator_init_path: ''
  gradient_checkpointing: true
  image_resolution: 512
  model_type: sd35
  pretrained_path: models/stable-diffusion-3.5-medium
  # Warm start for aux_v_model: a directory containing aux_v_transformer/
  # (diffusers format), distilled from the same Stage-2 generator. Weights only;
  # the aux optimizer state restarts.
  aux_v_init_path: ./checkpoints/aux_vel/mix
  generator_lora:
    enabled: true
    init_lora_weights: gaussian
    lora_alpha: 64
    merge_before_training: true
    rank: 32
    # AnyFlow Stage 1, merged into the base first.
    pre_merge_paths:
    - ./models/pretrained/meanflownft_loras/anyflow_pretrain/generator_ema.pt
    # AnyFlow Stage 2 (LoRA + delta_embedder), merged on top; a fresh LoRA is
    # then trained. Both paths are overridden by the launcher.
    load_path: ./models/pretrained/meanflownft_loras/anyflow_onpolicy/generator_ema.pt
    target_modules:
    - attn.to_q
    - attn.to_k
    - attn.to_v
    - attn.to_out.0
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.add_q_proj
    - attn.to_add_out
output_dir: ./outputs/dmdnft_mix
prompt_path: dataset/pickscore
solver:
  generator:
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr: 3.0e-06
    max_grad_norm: 1.0
    warmup_steps: 0
    weight_decay: 0.0001
  # Optimizer for aux_v_model; required when aux_v_enabled is true.
  aux_v:
    lr: 1.0e-05
    # Adam moments restart even with a warm-started network.
    warmup_steps: 100
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    # No decay: it would bias v_aux toward zero.
    weight_decay: 0.0
    max_grad_norm: 1.0
train:
  autocast_dtype: bf16
  batch_size: 9
  ema_decay: 0.9
  ema_every: 1
  gradient_accumulation_steps: 1
  log_interval: 1
  resume_from: ''
  save_interval: 100
  seed: 42
  total_steps: 0
  use_ema: true
