distributed:
  fsdp_sharding: full_shard
  strategy: fsdp
eval:
  dataset: ocr
  dataset_path: dataset
  enabled: true
  eval_batch_size: 16
  eval_guidance_scale: 1.0
  eval_interval: 50
  eval_num_steps: 4
  eval_prompt_source: dataset
  eval_seed: 12345
  num_media_images: 64
  reward_ckpt_path: ./models/reward_ckpts
  reward_dataset_map:
    aesthetic: ocr
    clipscore: ocr
    ocr: ocr
  reward_fn:
    aesthetic: 1.0
    clipscore: 1.0
    ocr: 1.0
fewstep_rl:
  adv_clip_max: 5.0
  # Unread by the AWM trainers. The anchor-based trainers use beta as the probe
  # half-width; AWM's corresponding slot is the likelihood ratio's temperature,
  # which is pinned to sigma = t by the algebra
  # (MeanFlowAWMTrainer.decoupled_weights), not configured. Left at the shared
  # default so a diff against the other configs stays readable.
  beta: 0.1
  # Load-bearing: MeanFlowAWMTrainer converts u -> v through the MeanFlow
  # identity before the jump to x_0, so it needs the shared central difference on
  # old_model. These three configure it.
  cd_velocity_source: noise_minus_x0
  central_diff_epsilon: 5.0
  consistency_ratio: 0.25
  decay_type: 1
  diffusion_ratio: 0.5
  kl_weight: 0.0001
  log_sample_images: 8
  num_batches_per_epoch: 16
  num_epochs: 10000
  num_image_per_prompt: 24
  num_inner_epochs: 1
  num_training_timesteps_per_sample: 4
  per_prompt_global_std: true
  per_prompt_stat_tracking: true
  reward_ckpt_path: ./models/reward_ckpts
  reward_fn:
    ocr: 1.0
  rl_decay_interval: 1
  rl_inner_batch_size: 0
  rl_max_timestep: 1000
  # 0 lets t reach the small-t tail, where AWM's ``omega = adv / (2 t**2)`` blows
  # up the LOGGED loss (the gradient is t-independent).
  # ``MeanFlowAWMTrainer._SIGMA_MIN`` floors it instead of raising this, so the
  # (t, r) grid stays identical to the other trials; revisit that constant if this
  # changes.
  rl_min_timestep: 0
  rl_sample_use_ema: false
  rl_start_epoch: 0
  sampling_guidance_scale: 1.0
  sampling_num_steps: 4
  # Mandatory here: the CD runs once per step on old_model and is read by both
  # the prediction and x_anchor_2, so they cannot disagree about S.
  share_cd_with_old: true
  text_max_sequence_length: 128
  use_ref_v_model: false
  # --- The three keys that differ in effect from meanflownft_ocr.yaml -----
  # PPO ratio-clip epsilon, wider than flow-GRPO's 1e-3, which is too tight for
  # AWM's ratio on this config (it binds on a large part of the batch after a
  # single step). Watch ``clipfrac``: the intended band is 0.05-0.2; if it
  # stays above that, loosen further.
  clip_range: 0.01
  # No renoise to score on this trial, so the rollout does not have to be an SDE:
  # it only has to produce x_0 and its reward. AWM builds its own transition by
  # re-noising x_0 at a fresh (t, r), and that forward noising is where the
  # stochasticity comes from.
  rollout_type: ode
  # MeanFlowAWMTrainer replays nothing (``_REPLAY_KEYS`` is empty) -- it uses
  # the base _rl_train_phase, which draws a fresh three-mode (t, r) per
  # iteration. Leaving this true would only make the rollout store
  # intermediates nobody reads.
  reuse_x_t: false

flowmap_model:
  deltatime_type: r
  enabled: true
  gate_value: 0.25
logging:
  enabled: true
  entity: ''
  project: fewsteprl
  run_name: meanflowawm_ocr
  tags:
  - sd35m
  - fewstep-rl
  - kl-u
  - ocr
  - awm
  - klw1e-4
  - '512'
model:
  dtype: bf16
  generator_init_path: ''
  generator_lora:
    enabled: true
    init_lora_weights: gaussian
    load_path: ''
    lora_alpha: 64
    merge_before_training: true
    pre_merge_paths: []
    rank: 32
    target_modules:
    - attn.to_q
    - attn.to_k
    - attn.to_v
    - attn.to_out.0
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.add_q_proj
    - attn.to_add_out
  gradient_checkpointing: true
  image_resolution: 512
  model_type: sd35
  pretrained_path: models/stable-diffusion-3.5-medium
output_dir: ./outputs/meanflowawm_ocr
prompt_path: dataset/ocr
solver:
  generator:
    beta1: 0.9
    beta2: 0.999
    eps: 1.0e-08
    lr: 3.0e-06
    max_grad_norm: 1.0
    warmup_steps: 0
    weight_decay: 0.0001
train:
  autocast_dtype: bf16
  batch_size: 9
  ema_decay: 0.9
  ema_every: 1
  gradient_accumulation_steps: 1
  log_interval: 1
  resume_from: ''
  save_interval: 100
  seed: 42
  total_steps: 0
  use_ema: true
